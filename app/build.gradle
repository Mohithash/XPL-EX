plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.faircode.xlua'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "eu.faircode.xlua"
        minSdk 23
        targetSdk 36
        versionCode 200
        versionName "2.0.0"
        archivesBaseName = "XPL-EX-v$versionName-$versionCode"
    }

    signingConfigs {
        release {
            if (System.getenv('GITHUB_WORKSPACE') != null) {
                storeFile file("${System.getenv('GITHUB_WORKSPACE')}/KEYSTORE.JKS")
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }

        debug {
            if (System.getenv('GITHUB_WORKSPACE') != null) {
                storeFile file("${System.getenv('GITHUB_WORKSPACE')}/KEYSTORE.JKS")
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            debuggable true
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/kotlinx_coroutines_core.version']
            excludes += ['META-INF/versions/**']
            excludes += ['META-INF/*.kotlin_module']
            pickFirsts += ['META-INF/kotlinx_coroutines_core.version']
            pickFirsts += ['META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    def appcompat_version = "1.7.0"
    def swiperefresh_version = "1.1.0"
    def recyclerview_version = "1.3.2"
    def constraintlayout_version = "2.1.4"
    def material_version = "1.12.0"
    def glide_version = "4.16.0"
    def lifecycle_version = "2.8.7"

    implementation "androidx.gridlayout:gridlayout:1.0.0"
    implementation "com.google.android.flexbox:flexbox:3.0.0"
    implementation "me.zhanghai.android.fastscroll:library:1.3.0"

    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"

    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$swiperefresh_version"
    implementation "androidx.recyclerview:recyclerview:$recyclerview_version"
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"
    implementation "com.google.android.material:material:$material_version"

    implementation("com.github.bumptech.glide:glide:$glide_version") {
        exclude group: "com.android.support"
    }
    annotationProcessor "androidx.annotation:annotation:1.8.2"
    annotationProcessor "com.github.bumptech.glide:compiler:$glide_version"

    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.14.0'

    def libsu_version = "5.2.2"
    implementation "com.github.topjohnwu.libsu:core:$libsu_version"
    implementation "com.github.topjohnwu.libsu:service:$libsu_version"
    implementation "com.github.topjohnwu.libsu:nio:$libsu_version"

    testImplementation 'junit:junit:4.13.2'
}
